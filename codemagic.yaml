workflows:
  android-workflow:
    name: Android APK Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Set up dependencies
        script: |
          flutter packages get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Build (Simulator / Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter packages get
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r rabitati-ios-unsigned.ipa Payload
          mv rabitati-ios-unsigned.ipa ../../../
    artifacts:
      - build/ios/iphoneos/Runner.app
      - rabitati-ios-unsigned.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
